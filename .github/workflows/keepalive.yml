# Пинг Supabase раз в 3 дня, чтобы бесплатный проект не уходил
# в паузу по неактивности (free tier засыпает после ~7 дней без запросов).
#
# Требуются секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_URL       — https://<project>.supabase.co
#   SUPABASE_ANON_KEY  — публичный anon key
name: Supabase keepalive

on:
  schedule:
    - cron: '23 6 */3 * *'   # каждые 3 дня в 06:23 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Секреты SUPABASE_URL / SUPABASE_ANON_KEY не заданы"
            exit 1
          fi
          curl --silent --show-error --fail \
            "${SUPABASE_URL}/rest/v1/family_members?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null -w 'Supabase ответил: HTTP %{http_code}\n'
