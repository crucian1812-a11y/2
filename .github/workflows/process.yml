name: Process watch history

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "data/incoming/**"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Parse history
        run: python scripts/parse_history.py

      - name: Summarize videos
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_PER_RUN: 40
        run: python scripts/summarize.py

      - name: Build site data
        run: python scripts/build_site.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data notes docs
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен."
          else
            git commit -m "chore: update notes and dashboard data [skip ci]"
            git push
          fi
