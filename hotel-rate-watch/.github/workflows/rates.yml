name: Check hotel rates

on:
  schedule:
    - cron: "0 6 * * *"        # ежедневно в 06:00 UTC
  workflow_dispatch:            # запуск вручную
  push:
    paths:
      - "hotels.yml"            # обновили список отелей — сразу пересобрать

permissions:
  contents: write               # чтобы коммитить собранные данные

concurrency:
  group: rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch rates from Amadeus
        env:
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          AMADEUS_ENV: ${{ vars.AMADEUS_ENV || 'test' }}
        run: python scripts/check_rates.py

      - name: Build dashboard data
        run: python scripts/build_site.py

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "rates: обновление тарифов $(date -u +%Y-%m-%d)"
            git push
          fi
