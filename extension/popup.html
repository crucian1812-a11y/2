<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>YTBrain Logger</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 240px;
      margin: 0;
      padding: 16px;
      background: #faf7f0;
      color: #1c1b22;
    }
    h1 { font-size: 14px; margin: 0 0 12px; }
    .count {
      font-size: 32px;
      font-weight: 700;
      color: #3a38f0;
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }
    .hint { font-size: 12px; color: #6b6a75; margin-bottom: 14px; }
    button {
      display: block;
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid #1c1b22;
      border-radius: 6px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      background: #3a38f0;
      border-color: #3a38f0;
      color: #fff;
    }
    button:focus-visible { outline: 2px solid #3a38f0; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>YTBrain Logger</h1>
  <div class="count" id="count">…</div>
  <div class="hint">видео в очереди</div>
  <button class="primary" id="download">Скачать лог</button>
  <button id="clear">Очистить очередь</button>
  <script src="popup.js"></script>
</body>
</html>
