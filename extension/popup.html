<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 240px;
      padding: 14px;
      margin: 0;
      background: #faf7f0;
      color: #1a1a1a;
    }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .count { font-size: 28px; font-weight: 700; color: #3A38F0; }
    .label { font-size: 12px; color: #666; margin-bottom: 12px; }
    button {
      display: block;
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      border: 1px solid #3A38F0;
      border-radius: 6px;
      background: #3A38F0;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: #3A38F0;
    }
    button:focus-visible { outline: 2px solid #1a1a1a; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>YTBrain Logger</h1>
  <div class="count" id="count">…</div>
  <div class="label">видео в очереди</div>
  <button id="download">Скачать лог</button>
  <button id="clear" class="secondary">Очистить очередь</button>
  <script src="popup.js"></script>
</body>
</html>
